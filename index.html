<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Privacy is a simple static GitHub Pages site that is publicly accessible."
    />
    <title>Privacy</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #111a2c;
        --text: #e5eefc;
        --muted: #9db3d0;
        --accent: #73c2ff;
        --accent-strong: #4ba3ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg), #162033);
        color: var(--text);
        display: grid;
        place-items: center;
      }

      .card {
        width: min(90vw, 720px);
        background: rgba(17, 26, 44, 0.9);
        border: 1px solid rgba(115, 194, 255, 0.2);
        border-radius: 18px;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.25);
        padding: 3rem 2.5rem;
      }

      .eyebrow {
        font-size: 0.78rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.25rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .badge {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        background: var(--accent);
        color: #071120;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .badge:hover,
      .badge:focus-visible {
        background: var(--accent-strong);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main class="card" aria-labelledby="page-title">
      <div class="eyebrow">Public page</div>
      <h1 id="page-title">Privacy</h1>
      <p>
        This repository includes a GitHub Pages site that is publicly accessible to anyone visiting
        the published GitHub Pages URL for this project.
      </p>
      <a class="badge" href="https://github.com/matiasgoris/Privacy">View repository</a>
    </main>
  </body>
</html>
